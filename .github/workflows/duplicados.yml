# Detector de codigo copiado (jscpd), estandar de la org.
#
# Copia este fichero tal cual a `.github/workflows/duplicados.yml` de tu repo.
# No necesita secretos: todo corre en local (jscpd sobre el arbol, git sobre
# el diff), asi que tampoco `secrets` que repartir.
#
# La implementacion vive en el repo del framework, no aqui:
#   pocharlies-org/k8s-gitops-pocharlies
#     .github/workflows/reusable-duplicados.yml  <- orquestacion
#     scripts/duplicados.py                      <- detector
#
# El check se llama `duplicados / duplicados`: ese nombre es el que exige el
# guardia de merge. No cambies ni el `name:` de arriba ni la clave del job.
#
# Falla SOLO si la PR introduce duplicacion nueva (bloques de >= 12 lineas
# copiados de algo que ya estaba, o copiado entre ficheros nuevos del propio
# PR). La duplicacion ya existente en el tronco no cuenta: no es culpa de
# quien llega ahora. Ajustes por repo con los inputs del reusable
# (`min_lineas`, `formatos`, `ignorar`) en el bloque `with:`.
#
# `workflow_dispatch` escanea el ultimo commit del tronco: es el modo con el
# que se valida el repo sin abrir un PR de prueba.
#
# `pull_request` a proposito, NUNCA `pull_request_target`: el segundo ejecuta
# con los secretos del repo base sobre codigo de un fork.
name: duplicados

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicados:
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-duplicados.yml@main
    with:
      # Este repo es espejo de openclaw/Peekaboo: todo lo que no es `pocharlies/`
      # es codigo de upstream, que el vigilante (update-watch, peekaboo-fork-update)
      # entra tag a tag y NUNCA edita aqui (INFRA-388: ni auto-resuelve ni auto-fusiona).
      # La duplicacion que upstream introduce en su propio arbol no es culpa de quien
      # la sincroniza y el fork no puede arreglarla sin divergir del espejo: SC-2560
      # dejo v4.9.3 y v4.9.4 dos dias bloqueados por una copia que upstream hizo de
      # su propio scripts/pblog.sh (Apps/Playground/scripts/playground-log.sh) y por
      # bloques repetidos dentro de sus tests. Se excluyen los directorios de
      # upstream; el codigo propio del fork (`pocharlies/`) sigue vigilado, salvo
      # `pocharlies/tests/`: jscpd casa los globs a cualquier profundidad y
      # `tests/**` se lleva por delante tambien los tests del fork (los .py de la
      # raiz de `pocharlies/`, que es el proxy, si siguen escaneandose). Si upstream
      # anade un directorio de codigo nuevo y el check vuelve a ponerse en rojo por
      # codigo de upstream, anadirlo a esta lista.
      ignorar: "Apps/**,scripts/**,tests/**,Core/**,Helpers/**,Commander/**,AXorcist/**,Swiftdansi/**,Tachikoma/**,TauTUI/**,assets/**,docs/**,experiments/**,release/**,skills/**,homebrew/**,.agents/**"
    secrets: inherit
